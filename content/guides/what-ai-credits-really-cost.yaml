        accessed: 2026-10-28
      - title: "Replit pricing"
        url: "https://replit.com/pricing"
        accessed: 2026-10-28
      - title: "Base44 pricing"
        url: "https://base44.com/pricing"
        accessed: 2026-10-28
      - title: "Bubble pricing"
        url: "https://bubble.io/pricing"
        accessed: 2026-10-28
  - heading: "Expiry and rollover change the math"
    body:
      - "Bolt.new rolls unused tokens over on paid plans. Lovable's monthly plan credits expire two months after they are issued, and daily build credits expire each day. A builder with rollover forgives an uneven month; one without it rewards steady use."
    sources:
      - title: "Bolt.new pricing"
        url: "https://bolt.new/pricing"
        accessed: 2026-10-28
      - title: "Lovable pricing"
        url: "https://lovable.dev/pricing"
        accessed: 2026-10-28
  - heading: "How to estimate your use"
    body:
      - "Start on the free plan and count how many prompts a typical change takes. Multiply by the number of changes you expect in a month and add a buffer for fixes. If that lands near a tier boundary, pick the higher tier for the first month and step down later."
    points:
      - "Count prompts per change on a real task, not a demo."
      - "Add a buffer for fixing what the AI got wrong."
      - "Check whether unused units roll over before buying a big tier."
    sources:
      - title: "Lovable docs: Subscription plans"
        url: "https://docs.lovable.dev/introduction/subscription-plans"
        accessed: 2026-10-28
