        url: "https://www.squarespace.com/pricing"
        accessed: 2026-10-28
      - title: "Framer pricing"
        url: "https://www.framer.com/pricing"
        accessed: 2026-10-28
  - heading: "When a long term is fine"
    body:
      - "A long prepaid term is reasonable when you are sure about the platform and the money-back window lets you test it first. Hostinger lists a 30-day money-back guarantee. If you are not sure yet, a monthly or yearly plan costs more per month but lets you leave sooner."
    sources:
