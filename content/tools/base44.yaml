centralQuestion: "Is Base44 the simplest way for a non-developer to get a working app with logins and a database?"
bestFor: "Small business owners and non-technical founders who want database, logins, hosting and payments without connecting anything."
notIdealFor: "Teams that need monthly billing without an annual commitment, since the pricing page lists annual prices only, and anyone who wants a paid plan for personal use, which the terms do not allow."
editorial: "Base44 is the most all-in-one app builder in this group: database, authentication, hosting and payments are built in, and paid plans add a custom domain with a free domain for a year. From Builder up, two-way GitHub sync exports the full source code, which answers the lock-in question."
pros:
  - "Database, authentication, hosting and payments are built in, according to the home page."
  - "Two-way GitHub sync exports the full source code to your own repository, on Builder and above."
  - "Paid plans include a custom domain and a free domain for one year."
  - "Starter is $16 a month billed annually with 100 message credits."
cons:
  - "The pricing page lists only annual-billing prices."
  - "GitHub sync, and with it code export, starts on Builder at $40 a month, not on Starter."
  - "The free plan allows 25 message credits a month, enough for a small trial only."
  - "Integration credits are a second allowance to watch, from 2,000 a month on Starter."
  - "The terms make fees and renewals non-refundable unless local law says otherwise."
  - "Unused credits expire each month, and credits spent on output with errors are not restored."
review:
  - id: built-in
    heading: "Everything built in"
    body:
      - "Base44's home page says you describe your idea in plain language and keep refining the app by chatting. User management and authentication are built in, the database is already there, hosting is built in and you can get paid directly through Base44."
      - "A yoga studio owner who wants members to log in and book classes does not need to set up a database or a login service. The trade-off is that the app lives on Base44 until you use GitHub sync."
    sources:
      - title: "Base44"
        url: "https://base44.com"
        accessed: 2026-10-28
  - id: plans
    heading: "Plans, credits and the annual price"
    body:
      - "Billed annually, Starter costs $16 a month with 100 message credits and 2,000 integration credits, Builder $40 with 250 and 10,000, Pro $80 with 500 and 20,000, and Elite $160 with 1,200 and 50,000. The page says annual billing saves 20% but lists no monthly-billing prices."
    sources:
      - title: "Base44 pricing"
        url: "https://base44.com/pricing"
        accessed: 2026-10-28
  - id: export
    heading: "Leaving with your code"
    body:
      - "The pricing FAQ says two-way GitHub sync exports the full source code to your own repo at any time. The GitHub integration is listed on Builder, Pro and Elite, so if an exit path matters to you, budget for Builder rather than Starter."
    sources:
      - title: "Base44 pricing"
        url: "https://base44.com/pricing"
        accessed: 2026-10-28
  - id: terms
    heading: "What the terms of service say"
    body:
      - "Base44 is operated by Wix.com Ltd. The terms, last updated June 22, 2026, say you own the code and apps the platform generates for you. They also give Base44 a broad license to your data and generated output, including to train its AI models, and let it use your content in its marketing."
      - "Money matters most here. Fees are non-refundable unless local law requires otherwise, subscriptions renew automatically at the then-current price without any intro discount, and the card can be charged up to three weeks before the renewal date. Turn off auto-renewal in your account settings if you only want one term."
      - "Credits reset monthly and do not roll over. The number of credits an action uses depends on its complexity and can change, and credits spent on output with errors or hallucinations are not restored. Free plan credits can be reduced or withdrawn at any time."
      - "Paid plans are for business or professional use only; the free plan may also be used personally. Health or payment card data needs a separate agreement first, and the terms advise against using generated apps in medical, legal or financial settings. You are responsible for reviewing generated code, for security settings, since defaults may allow public access, and for your own backups."
      - "Disputes go to individual arbitration in the US, with a class action waiver. You can opt out of arbitration by emailing compliance@base44.com within 30 days of signing up. Base44's liability is capped at what you paid in the last 12 months or $100, whichever is greater."
    sources:
      - title: "Base44 Terms of Service"
        url: "https://base44.com/about-us/legal/terms-of-service"
        accessed: 2026-10-28
